<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Wordle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>WORDLE<span class="highlight">.IO</span></h1>
        </header>

        <!-- View 1: Lobby -->
        <section id="lobby-view" class="view active glass-panel">
            <h2>Join a Game</h2>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Your Name" autocomplete="off" maxlength="12">
            </div>
            <div class="input-group">
                <input type="text" id="room-code" placeholder="Room Code (e.g. ROOM1)" autocomplete="off" maxlength="8">
            </div>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="create-btn" class="primary-btn" style="background-color: var(--secondary-color); margin-top: 10px;">Create Room</button>
                <button id="join-btn" class="primary-btn">Join Room</button>
            </div>
            <p id="lobby-error" class="error-msg"></p>
        </section>

        <!-- View 2: Waiting Room -->
        <section id="waiting-view" class="view glass-panel">
            <h2>Room: <span id="display-room-code" class="highlight"></span></h2>
            <div class="players-list" id="waiting-players-list">
                <!-- Populated by JS -->
            </div>
            
            <!-- Host Settings -->
            <div id="room-settings" style="width: 100%; margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; text-align: left;">
                <h4 style="margin-bottom: 10px; color: var(--secondary-color);">Room Settings <span id="host-badge" style="display: none;">👑 (You are Host)</span></h4>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <label for="timer-toggle">Enable Timer:</label>
                    <input type="checkbox" id="timer-toggle" style="width: auto;">
                    <label for="surrender-toggle" style="margin-left: 20px;">Allow Surrender:</label>
                    <input type="checkbox" id="surrender-toggle" style="width: auto;">
                </div>
                <div id="timer-input-group" style="display: none; align-items: center; gap: 10px;">
                    <label for="timer-value">Minutes:</label>
                    <input type="number" id="timer-value" min="1" max="60" value="3" style="width: 80px; padding: 5px; text-align: left;">
                    <button id="save-settings-btn" class="secondary-btn" style="padding: 5px 10px; display: none;">Save</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="ready-btn" class="primary-btn">Ready Up</button>
                <button id="leave-room-btn" class="primary-btn" style="background-color: var(--danger-color, #e74c3c);">Leave Room</button>
            </div>
            <p class="hint">Game starts when everyone is ready.</p>
        </section>

        <section id="game-view" class="view">
            <div class="game-container">
                <!-- Main Player Board -->
                <div class="main-board-container glass-panel">
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 15px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <h3 style="margin: 0;">Your Board</h3>
                            <button id="surrender-btn" class="secondary-btn" style="display: none; padding: 5px 10px; background-color: var(--danger-color, #e74c3c); border-color: var(--danger-color, #e74c3c); color: white;">Give Up</button>
                        </div>
                        <div id="timer-display" style="font-size: 1.5rem; font-weight: bold; color: var(--secondary-color); font-variant-numeric: tabular-nums;">--:--</div>
                    </div>
                    <div id="main-board" class="board">
                        <!-- 5x6 Grid generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Virtual Keyboard -->
            <div id="keyboard" class="keyboard">
                <div class="keyboard-row">
                    <button data-key="q">Q</button><button data-key="w">W</button><button data-key="e">E</button><button data-key="r">R</button><button data-key="t">T</button><button data-key="y">Y</button><button data-key="u">U</button><button data-key="i">I</button><button data-key="o">O</button><button data-key="p">P</button>
                </div>
                <div class="keyboard-row">
                    <div class="spacer half"></div><button data-key="a">A</button><button data-key="s">S</button><button data-key="d">D</button><button data-key="f">F</button><button data-key="g">G</button><button data-key="h">H</button><button data-key="j">J</button><button data-key="k">K</button><button data-key="l">L</button><div class="spacer half"></div>
                </div>
                <div class="keyboard-row">
                    <button data-key="Enter" class="wide">ENTER</button><button data-key="z">Z</button><button data-key="x">X</button><button data-key="c">C</button><button data-key="v">V</button><button data-key="b">B</button><button data-key="n">N</button><button data-key="m">M</button><button data-key="Backspace" class="wide">⌫</button>
                </div>
            </div>
        </section>

        <!-- View 4: Spectator View -->
        <section id="spectator-view" class="view glass-panel" style="max-width: 90vw; width: 800px;">
            <h2>Spectator Mode</h2>
            <p>Watching remaining players...</p>
            <div id="spectator-grid" class="spectator-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- View 5: Post-Game Leaderboard -->
        <section id="leaderboard-view" class="view glass-panel">
            <h2>Game Over</h2>
            <p>The word was: <span id="final-target-word" class="highlight"></span></p>
            <div id="leaderboard-list" class="leaderboard-list">
                <!-- Populated by JS -->
            </div>
            <button id="play-again-btn" class="primary-btn">Back to Room</button>
        </section>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
